<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Admin Notepad</title>

</head>
<body>
<nav class="Nav-Bar">
    <a href="../index.html" class="Nav-Logo"><p>Michail Lionakis</p></a>
    <div class="dropdown">
        <button class="dropbtn" onclick="toggleMenu()">Menu</button>
        <div class="dropdown-content" id="navDropdown">
            <a href="#" class="close-btn" onclick="toggleMenu()">&times;</a>
            <div class="lang-menu-row">
                <div class="lang-links">
                    <a href="javascript:void(0)" onclick="changeLanguage('nl')" class="lang-option" id="lang-nl">NL</a>
                    <span class="divider">|</span>
                    <a href="javascript:void(0)" onclick="changeLanguage('en')" class="lang-option" id="lang-en">EN</a>
                </div>
            </div>
            <a href="../index.html" data-nl="Thuis" data-en="Home">Home</a>
            <a href="../HTML/Services.html" data-nl="Diensten" data-en="Services">Services</a>
            <a href="../HTML/Projects.html" data-nl="Projecten" data-en="Projecten">Projects</a>

            <a href="../HTML/Contact.html" data-nl="Contact" data-en="Contact">Contact</a>
        </div>
    </div>
</nav>
<div id="login-container">
    <input type="email" id="adminEmail" placeholder="Email">
    <input type="password" id="adminPassword" placeholder="Password">
    <button onclick="login()">Login</button>
</div>
<div id="admin-content" style="display: none;">
    <div class="notepad-container">
        <textarea id="textInput" placeholder="Write your notes here..."></textarea>
        <div class="button-row">
            <button onclick="updateData()">Save Note</button>
            <button onclick="logout()" style="background-color: #ff4d4d;">Logout</button>
        </div>
    </div>
</div>
<script type="module" src="../JavaScript/AdminData.js"></script>
</body>
